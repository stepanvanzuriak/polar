[package]
name = "runtime-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "polar_rt"
path = "src/lib.rs"

[[bin]]
name = "polar-rt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
polar-compiler = { path = "../compiler" }
regex = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
scrypt = "0.11"
getrandom = "0.2"
subtle = "2"
walkdir = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
polar-cli = { path = "../cli" }
