name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section '## $version' for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

  build:
    needs: notes
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "polar-cli") | .version')
          if [ "v$version" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "tag $GITHUB_REF_NAME does not match polar-cli $version" >&2
            exit 1
          fi
      - run: cargo build --release --locked -p polar-cli -p runtime-native --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="polar-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/polar" "$name/"
          cp "target/${{ matrix.target }}/release/polar-rt" "$name/"
          cp LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cp "target/${{ matrix.target }}/release/polar-rt" "polar-rt-${{ matrix.target }}"
          shasum -a 256 "polar-rt-${{ matrix.target }}" > "polar-rt-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            polar-*.tar.gz*
            polar-rt-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section '## $version' for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
